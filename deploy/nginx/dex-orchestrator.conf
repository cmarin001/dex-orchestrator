limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DEX_DOMAIN__;
    location / { return 308 https://__DEX_DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DEX_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DEX_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DEX_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Dex-Proxy 1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = / {
        default_type text/plain;
        return 200 "DEX Orchestrator API. The /api/v1/status endpoint requires a bearer token.\n";
    }

    # Keep MCP private by default. Use an SSH tunnel to 127.0.0.1:3001.
    # location /mcp/ {
    #     proxy_pass http://127.0.0.1:3001/mcp;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Authorization $http_authorization;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_buffering off;
    # }

    location / { return 404; }
}
