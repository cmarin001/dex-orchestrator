name: ci
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.6
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/compare-api-routes.ts
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test
      - run: npm run build
      - run: npm run simulate
      - run: for file in deploy/cicd/*.sh; do bash -n "$file"; done
      - run: bash tests/deploy-cicd.sh
